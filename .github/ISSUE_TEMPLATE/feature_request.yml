name: ✨ Feature request
description: Suggest an idea or enhancement for Shreyzen
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: Thanks for the suggestion! Please check the Roadmap in the README and existing issues first.
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: The motivation — what are you trying to do that's hard or impossible today?
      placeholder: "I'm always frustrated when ..."
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: What you'd like to happen.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Any other approaches or workarounds you've thought about.
    validations:
      required: false
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Functional tests (api/web/mobile)
        - Load testing (Locust)
        - Studio / dashboards
        - AI / LLM features
        - CI / GitHub Actions
        - Docs
        - Other
    validations:
      required: true
  - type: checkboxes
    id: contribute
    attributes:
      label: Contribution
      options:
        - label: I'd be willing to help implement this.
          required: false
