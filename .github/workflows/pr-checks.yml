name: PR Checks

# Gate for every pull request (and pushes to main):
#   1. API contract smoke tests against the local mock API
#   2. A smoke load profile on the CRUD scenario (fails if thresholds breach)
#   3. Web UI tests (desktop Chromium) against saucedemo.com
#   4. Mobile UI tests (Chromium device emulation)
# Heavier load/soak runs live in the manual + nightly workflows.
#
# The framework lives in Shreyzen/, so all run steps default to that directory.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

defaults:
  run:
    working-directory: Shreyzen

jobs:
  api-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: Shreyzen/requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Start mock API server
        run: |
          python tools/mock_api_server.py --port 8765 &
          for i in $(seq 1 20); do curl -sf http://localhost:8765/ping && break; sleep 0.5; done
      - name: API contract smoke tests
        env:
          API_BASE_URL: http://localhost:8765
          BASE_URL: http://localhost:8765
          TEST_USER_EMAIL: ci@example.com
          TEST_USER_PASSWORD: ci-password
        run: pytest tests/api -v -m smoke --junitxml=logs_and_reports/api-junit.xml
      - name: Upload API results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-smoke-results
          path: Shreyzen/logs_and_reports/

  load-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: Shreyzen/requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Smoke load test (CRUD)
        # The engine auto-starts the mock API on localhost and gates on the
        # smoke profile's thresholds (exit non-zero on breach → fails the PR).
        run: python tools/studio.py run --scenario crud --profile smoke
      - name: Upload load reports (html + junit + json + allure)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: load-smoke-reports
          path: Shreyzen/logs_and_reports/load_runs/

  web-tests:
    runs-on: ubuntu-latest
    env:
      BASE_URL: https://www.saucedemo.com
      # Public saucedemo demo credentials. The authenticated_page fixture logs in
      # with these, so they must be real saucedemo creds (not placeholders) or
      # the cart tests fail on login.
      TEST_USER_EMAIL: standard_user
      TEST_USER_PASSWORD: secret_sauce
      HEADLESS: "true"
      RECORD_VIDEO: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: Shreyzen/requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Install Chromium (with OS deps)
        run: python -m playwright install --with-deps chromium
      - name: Web UI tests (desktop)
        # Re-enable pytest-rerunfailures (disabled by default in pytest.ini so the
        # framework's flaky-detection sees real failures) for this CI-only run.
        # Only retry transient network/timeout errors, not assertion failures.
        run: >-
          pytest tests/web -v
          -p rerunfailures --reruns 2 --reruns-delay 3
          --only-rerun 'TimeoutError|Timeout|ConnectionError|ERR_|net::|Connection'
          --junitxml=logs_and_reports/web-junit.xml
      - name: Upload web artifacts (screenshots + report + junit)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-test-results
          path: Shreyzen/logs_and_reports/

  mobile-tests:
    runs-on: ubuntu-latest
    env:
      BASE_URL: https://www.saucedemo.com
      # Public saucedemo demo credentials — see note in web-tests above.
      TEST_USER_EMAIL: standard_user
      TEST_USER_PASSWORD: secret_sauce
      HEADLESS: "true"
      RECORD_VIDEO: "false"
      MOBILE_DEVICE: "Pixel 5"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: Shreyzen/requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Install Chromium (with OS deps)
        # Mobile emulation (is_mobile/touch) is a Chromium capability.
        run: python -m playwright install --with-deps chromium
      - name: Mobile UI tests (device emulation)
        # See web-tests: CI-only reruns limited to transient network errors.
        run: >-
          pytest tests/mobile -v
          -p rerunfailures --reruns 2 --reruns-delay 3
          --only-rerun 'TimeoutError|Timeout|ConnectionError|ERR_|net::|Connection'
          --junitxml=logs_and_reports/mobile-junit.xml
      - name: Upload mobile artifacts (screenshots + report + junit)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-test-results
          path: Shreyzen/logs_and_reports/
