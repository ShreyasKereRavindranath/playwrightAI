[pytest]
# ── Test discovery ──────────────────────────────────────────────────────────
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# ── Output & verbosity ──────────────────────────────────────────────────────
addopts =
    --strict-markers
    -v
    --tb=short
    -p no:rerunfailures
    --html=logs_and_reports/report.html
    --self-contained-html

# ── Playwright-specific ─────────────────────────────────────────────────────
# Override defaults per-run with CLI flags:
#   pytest --browser firefox --headed --tracing=on
# These ini values apply when no CLI flag is provided.

# ── Registered markers ──────────────────────────────────────────────────────
markers =
    smoke:       Critical path tests — run on every deployment
    regression:  Full regression suite — run nightly or pre-release
    slow:        Tests taking more than 30 seconds — excluded from fast runs
    api:         API-layer tests that do not require a browser
    unit:        Fast pure-Python unit tests (no browser, no network)
    web:         Browser UI tests (desktop viewport)
    mobile:      Browser UI tests under mobile-device emulation
    visual:      Visual regression / screenshot comparison tests
    e2e:         End-to-end multi-page user journeys
    negative:    Negative / invalid-input scenarios (error handling)
    accessibility: Accessibility (a11y) assertions

# ── Logging ─────────────────────────────────────────────────────────────────
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)s] %(name)s — %(message)s
log_cli_date_format = %H:%M:%S
log_file = logs_and_reports/pytest.log
log_file_level = DEBUG
log_file_format = %(asctime)s [%(levelname)s] %(name)s — %(message)s
log_file_date_format = %Y-%m-%d %H:%M:%S

# ── Filtering warnings ───────────────────────────────────────────────────────
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
